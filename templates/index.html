<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F1 Racing Intelligence Dashboard</title>
  <script type="module" src="https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #111; color: #fff; }
    header { background: #e10600; padding: 20px; text-align: center; }
    header h1 { margin: 0 0 12px; }
    nav a { display: inline-block; margin: 4px; padding: 10px 18px; background: #fff; color: #e10600; text-decoration: none; border-radius: 6px; font-weight: bold; }
    section { max-width: 1200px; margin: 30px auto; padding: 0 16px; }
    h2 { border-left: 6px solid #e10600; padding-left: 10px; }
    tableau-viz { width: 100%; height: 900px; display: block; background: #1b1b1b; }
    .fallback { width: 100%; height: 900px; border: 0; background: #fff; display: block; }
    .note { font-size: 14px; color: #bbb; margin: 6px 0 12px; }
    footer { text-align: center; padding: 20px; background: #000; }
    footer a { color: #ff6b66; }
  </style>
</head>
<body>
  <header>
    <h1>F1 Racing Intelligence Dashboard</h1>
    <nav>
      <a href="#dashboard">Interactive Dashboard</a>
      <a href="#story">Data Story</a>
    </nav>
  </header>

  <section id="dashboard">
    <h2>Interactive Dashboard</h2>
    <p class="note">Loading dashboard... if nothing appears, use the Tableau Public link below.</p>
    <tableau-viz id="dashViz" src="{{ dashboard_url }}" device="desktop" width="100%" height="900" toolbar="bottom" hide-tabs></tableau-viz>
  </section>

  <section id="story">
    <h2>Data Story</h2>
    <p class="note">Loading story... if nothing appears, use the Tableau Public link below.</p>
    <tableau-viz id="storyViz" src="{{ story_url }}" device="desktop" width="100%" height="900" toolbar="bottom" hide-tabs></tableau-viz>
  </section>

  <footer>
    Open on Tableau Public:
    <a href="{{ dashboard_link }}" target="_blank">Dashboard</a> |
    <a href="{{ story_link }}" target="_blank">Story</a>
  </footer>
</body>
</html>
